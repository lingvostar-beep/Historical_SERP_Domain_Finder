# VPS-only ports — do not collide with Rybbit (:5432/:6379) or local Windows compose.
services:
  db:
    image: postgres:16-alpine
    container_name: hsdf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hsdf
      POSTGRES_PASSWORD: ${HSDF_PG_PASSWORD:-hsdf}
      POSTGRES_DB: hsdf
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - hsdf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsdf -d hsdf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hsdf-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hsdf_pgdata:
